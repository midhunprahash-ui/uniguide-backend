[project]
name = "uniguide-backend"
version = "2.0.0"
description = "UniGuide API - RAG system for institutional knowledge with Supabase"
requires-python = ">=3.10"
authors = [
    {name = "UniGuide Team"}
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "B904", "B905"]  # Line too long, func call in default arg, exception chaining, strict zip

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
